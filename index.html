<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#12161D">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Лабиринт дня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=Rubik:wght@700;800&display=swap">
<style>
/* Концепт: игра на одном экране телефона. Сверху название и таймер, ниже поле, под ним кнопки и результат с готовой фразой, чтобы поделиться. */
:root {
  --bg: #EDF0F4; --fg: #1B2230; --muted: #5B6577; --line: #D3D9E2; --panel: #FFFFFF; --accent: #D9531C;
  --ink: #22304A; --orange: #F2733A; --teal: #1F9E96; --yellow: #F5C242; --sheet: #FFFFFF;
  --display: "Rubik", "Arial Black", system-ui, sans-serif; --text: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12161D; --fg: #E8ECF2; --muted: #9AA4B5; --line: #2B3342; --panel: #1B212C; --accent: #FF8A57; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12161D; --fg: #E8ECF2; --muted: #9AA4B5; --line: #2B3342; --panel: #1B212C; --accent: #FF8A57; color-scheme: dark; }
html, body { overscroll-behavior: none; }
#game .langs { display: none; }
body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 16px; line-height: 1.45;
  padding-block: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; margin: 0; }
.sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-weight: 700; }
.timer { font-family: var(--display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; min-width: 4.6ch; text-align: right; }
.field { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
canvas { display: block; margin: 0 auto; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 8px; }
.hint { margin: 0; font-size: 14px; color: var(--muted); text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 700; font-size: 15px; border-radius: 99px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); flex: 1 1 auto; }
button.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #1B2230); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.result h2 { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 0; }
.result p { margin: 0; font-size: 15px; }
.share { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; word-break: break-word; user-select: all; }
.best { color: var(--muted); font-size: 14px; }
[hidden] { display: none !important; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; }
.bar button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; }
.row button { padding: 10px 12px; font-size: 14px; }
.stars { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; }
.warn { color: var(--accent); font-weight: 700; }
button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #1B2230); }
.langs { display: flex; flex-wrap: wrap; gap: 6px; }
.langs button { flex: 0 0 auto; padding: 5px 12px; font-size: 13px; }
.langs button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #1B2230); }
#menu { padding-top: 4px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; width: 100%; border-radius: 16px; padding: 14px 16px; font-size: 18px; flex: none; background: var(--panel); }
.tile small { font-family: var(--text); font-weight: 700; font-size: 13px; color: var(--muted); }
.tile.main small { color: var(--on-accent, #1B2230); }
.tile[disabled] { opacity: .55; cursor: default; }
.menu-t { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 4px 0 0; }
#puz .field { padding: 6px; }
#snk canvas { touch-action: none; margin: 0 auto; }
.pboard { position: relative; margin: 0 auto; border-radius: 12px; background: #D3D9E2; touch-action: manipulation; }
button.ptile { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; flex: none; padding: 0; border: none; border-radius: 10px;
  background: var(--tile, #F2733A); color: #fff; font-family: var(--display); font-weight: 800; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); transition: transform .12s ease; user-select: none; -webkit-user-select: none; }
button.ptile.ok { background: var(--tile-ok, #1F9E96); color: var(--on-accent, #fff); }
#menu .sub { margin: 0; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 4px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.25); }
.wheelbox { position: relative; width: 260px; height: 260px; margin: 14px auto 6px; }
.wheel { width: 260px; height: 260px; border-radius: 50%; border: 4px solid var(--fg); position: relative; box-sizing: border-box;
  background: conic-gradient(var(--tile) 0 45deg, var(--accent) 45deg 90deg, var(--tile) 90deg 135deg, var(--accent) 135deg 180deg, var(--tile) 180deg 225deg, var(--accent) 225deg 270deg, var(--tile) 270deg 315deg, var(--accent) 315deg 360deg); }
.wheel span { position: absolute; left: calc(50% - 22px); top: calc(50% - 13px); width: 44px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 19px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.65); }
.wptr { position: absolute; top: -8px; left: 50%; margin-left: -13px; border: 13px solid transparent; border-top: 24px solid var(--fg); z-index: 2; }
.wres { text-align: center; font-family: var(--display); font-weight: 800; font-size: 18px; min-height: 26px; margin: 0; }

.cfloat { position: fixed; top: 14px; right: 16px; z-index: 50; font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--ink); background: var(--accent); border-radius: 20px; padding: 4px 14px; animation: cf 1.5s ease forwards; pointer-events: none; }
@keyframes cf { 0% { opacity: 0; transform: translateY(12px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-36px); } }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .tile { padding: 12px; font-size: 16px; }
.mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button.mcard { aspect-ratio: 1; padding: 0; border: none; border-radius: 12px; font-size: clamp(26px, 9vw, 40px); background: var(--tile, #F2733A); color: #fff; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
button.mcard.up { background: var(--sheet); border: 2px solid var(--line); box-shadow: none; }
button.mcard.ok { background: var(--tile-ok, #1F9E96); }
.pin { width: 100%; box-sizing: border-box; font-size: 20px; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--sheet); color: var(--fg); text-transform: uppercase; }
.onb { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.onb .big { font-size: 72px; line-height: 1; }
.onb h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; }
.onb p { margin: 0; max-width: 320px; color: var(--muted); font-weight: 700; }
.onb button { flex: none; height: auto; min-height: 0; padding: 14px 28px; }
.onb .dots { display: flex; gap: 8px; } .onb .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); } .onb .dots i.on { background: var(--accent); }
.tile.hasic { flex-direction: row; align-items: center; gap: 14px; padding: 10px 14px; }
.tile .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .ti { width: 58px; height: 58px; flex: none; }
.grid2 .tile.hasic { gap: 10px; padding: 10px; }
.grid2 .tile .ti { width: 42px; height: 42px; }
.grid2 .tile .tx { font-size: 15px; }
</style>
</head>
